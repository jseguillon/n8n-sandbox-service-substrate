# Strategic merge patch for the Substrate atelet DaemonSet. This configures
# Go's Actor image-pull TLS client, not Kubernetes Pod image pulls.
# Create the actor-registry-ca ConfigMap with the issuer CA before applying.
spec:
  template:
    spec:
      containers:
      - name: atelet
        env:
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs:/run/registry-ca
        volumeMounts:
        - name: actor-registry-ca
          mountPath: /run/registry-ca
          readOnly: true
      volumes:
      - name: actor-registry-ca
        configMap:
          name: actor-registry-ca
          items:
          - key: ca.crt
            path: registry-ca.crt
